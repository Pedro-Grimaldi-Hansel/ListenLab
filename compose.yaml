name: listenlab

x-app: &app
  build:
    context: .
    target: app
  image: listenlab-php:local
  working_dir: /app
  init: true
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - .:/app
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: db
    # PostgreSQL always listens on 5432 inside the Compose network.
    # DB_PORT in .env controls the published host port independently.
    DB_PORT: "5432"
    # Windows bind mounts can have different ownership inside Linux containers.
    # Trust only this project's mount for Git commands run by Composer.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /app
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: listenlab-postgres:local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-listenlab}
      POSTGRES_USER: ${POSTGRES_USER:-listenlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local database password}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    <<: *app
  callback:
    <<: *app
    profiles: [auth]
    # The development server's access logs would include the OAuth callback code.
    command: ["sh", "-c", "exec php -S 0.0.0.0:8888 -t public public/index.php 2>/dev/null"]
    ports:
      - "127.0.0.1:8888:8888"
  scheduler:
    <<: *app
    profiles: [schedule]
    command: ["php", "bin/scheduler.php"]
    restart: unless-stopped
  monitor:
    build:
      context: .
      target: monitor
    image: listenlab-monitor:local
    working_dir: /app
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    volumes:
      - ./vendor:/app/vendor:ro
      - ./src:/app/src:ro
      - ./monitor:/app/monitor:ro
    secrets:
      - monitor_db_password
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-listenlab}
      MONITOR_DB_USER: ${MONITOR_DB_USER:-listenlab_monitor}
      MONITOR_DB_PASSWORD_FILE: /run/secrets/monitor_db_password
      MONITOR_PORT: ${MONITOR_PORT:-8787}
      MONITOR_TIMEZONE: ${MONITOR_TIMEZONE:-America/Sao_Paulo}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      RAW_ARCHIVE_AFTER_DAYS: ${RAW_ARCHIVE_AFTER_DAYS:-30}
      RAW_MAINTENANCE_ENABLED: ${RAW_MAINTENANCE_ENABLED:-1}
      RAW_BACKUP_KEEP: ${RAW_BACKUP_KEEP:-3}
    depends_on:
      db:
        condition: service_healthy
    profiles: [monitor]
    command: ["php", "-S", "0.0.0.0:8787", "-t", "monitor/public", "monitor/router.php"]
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8787}:8787"
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  monitor_db_password:
    file: ${MONITOR_DB_PASSWORD_FILE:-./storage/secrets/monitor-db-password}
