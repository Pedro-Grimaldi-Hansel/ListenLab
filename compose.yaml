name: listenlab

x-app: &app
  build: .
  image: listenlab-php:local
  working_dir: /app
  init: true
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - .:/app
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: db
    # PostgreSQL always listens on 5432 inside the Compose network.
    # DB_PORT in .env controls the published host port independently.
    DB_PORT: "5432"
    # Windows bind mounts can have different ownership inside Linux containers.
    # Trust only this project's mount for Git commands run by Composer.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /app
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-listenlab}
      POSTGRES_USER: ${POSTGRES_USER:-listenlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local database password}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    <<: *app
  callback:
    <<: *app
    profiles: [auth]
    # The development server's access logs would include the OAuth callback code.
    command: ["sh", "-c", "exec php -S 0.0.0.0:8888 -t public public/index.php 2>/dev/null"]
    ports:
      - "127.0.0.1:8888:8888"
  scheduler:
    <<: *app
    profiles: [schedule]
    command: ["php", "bin/scheduler.php"]
    restart: unless-stopped
  monitor:
    <<: *app
    profiles: [monitor]
    command: ["php", "-S", "0.0.0.0:8787", "-t", "monitor/public", "monitor/router.php"]
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8787}:8787"
    restart: unless-stopped

volumes:
  postgres_data:
